name: Keep Supabase project awake

on:
  schedule:
    - cron: '0 2 */3 * *'   # ogni 3 giorni alle 2:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run a real query against the database
        run: |
          set -euo pipefail
          # Query reale su una tabella (non la root di PostgREST), così
          # Supabase conta l'attività sul database e non mette in pausa il progetto.
          status=$(curl -s -o response.json -w "%{http_code}" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            "${{ vars.VITE_SUPABASE_URL }}/rest/v1/works?select=id&limit=1")
          echo "status=$status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Query failed:"
            cat response.json
            exit 1
          fi
