name: Weekly backup

# Supabase Free non conserva alcun backup — questa è l'unica copia
# dei dati che esiste fuori dal progetto live. Gli artifact ruotano
# automaticamente dopo retention-days.

on:
  schedule:
    - cron: '11 3 * * 0'   # ogni domenica alle 03:11 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        run: |
          set -euo pipefail
          filename="opus35-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" --no-owner --no-privileges | gzip > "$filename"
          echo "BACKUP_FILE=$filename" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Verify the dump is non-empty
        run: |
          size=$(stat -c%s "${{ env.BACKUP_FILE }}")
          echo "backup size: $size bytes"
          if [ "$size" -lt 1024 ]; then
            echo "backup suspiciously small — treating as a failure"
            exit 1
          fi
